<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workboat World</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
      canvas { display: block; }
      #help {
        position: fixed; left: 12px; bottom: 12px; max-width: 430px;
        font: 12px/1.3 system-ui, sans-serif; color: #e8eef2;
        background: rgba(10, 20, 30, 0.72); padding: 10px 12px; border-radius: 6px;
        pointer-events: none;
      }
      #help[hidden] { display: none; }
      #help .title { font-weight: 600; color: #fff; margin: 4px 0 2px; }
      #help .hint { color: #b9c7d2; margin-bottom: 4px; }
      #help table { border-collapse: collapse; margin-bottom: 4px; }
      #help td { padding: 1px 10px 1px 0; vertical-align: middle; }
      #help td:first-child { white-space: nowrap; }
      #help kbd {
        display: inline-block; min-width: 1.4em; padding: 1px 5px; text-align: center;
        font: 600 12px/1.3 ui-monospace, Menlo, Consolas, monospace; color: #fff;
        background: #2b3a48; border: 1px solid #5a6e80; border-bottom-width: 2px; border-radius: 4px;
      }
      #help b { color: #fff; }
      /* The recording camera's clean screen (player/cameraMode.ts): only the picture. */
      body.camera-clean > :not(canvas) { visibility: hidden !important; }
    </style>
  </head>
  <body>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
