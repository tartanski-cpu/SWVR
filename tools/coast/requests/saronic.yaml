# Region request: the Saronic Islands (owner, Oct 2026, from a map picture): Aegina and Agia
# Marina, Agistri and Moni, Methana, Poros and Galatas, the Argolid coast from Pefkali and
# Korfos down past Nea and Archaia Epidavros to Troizina, and the islets of the gulf between
# (Stachtorroi, Ypsili, the Diaporia). Full scale, about 44 x 47 km, for Voyage mode only, in
# chunks the game streams in round the boat. The Aegean theme (themes.ts), as Syros.
id: saronic
name: The Saronic Islands
bbox: [23.08, 37.48, 23.58, 37.89]   # lon/lat min, max
theme: aegean
chunked: true
spine:
  harbour.sheltered: auto
  pier.exposed: auto
  anchorage: auto
weatherProfile: aegean-meltemi
fish: [mackerel, lobster]
goods: [building-materials, groceries]
# The ferry lines from Piraeus come in from beyond the map: only the named ones, each once.
ferriesNamed: true
