# Region request: Ålesund and the Sunnmøre islands (owner, Oct 2026, from a map picture):
# Ålesund on its islands (Aspøya, Nørvøya, Hessa) and Ellingsøya, Valderøya, Vigra and Godøya
# to the north-west, Uksenøya and Brusdalsvatnet east of the town; Sula and Åsefjorden; the
# Breisundet entrance; Hareidlandet with Hareid, Brandal and Ulsteinvik; Gurskøya and Herøy;
# the Vartdalsfjorden and Storfjorden, south to Ørsta. Full scale, about 55 x 52 km, for
# Voyage mode only, in chunks the game streams in round the boat. The West Norwegian theme
# (themes.ts): steep grey rock, spruce, pine and birch below the treeline, white and red
# wooden houses.
id: sunnmore
name: Ålesund and Sunnmøre
bbox: [5.55, 62.15, 6.62, 62.62]   # lon/lat min, max
theme: west-norwegian
chunked: true
spine:
  harbour.sheltered: auto
  pier.exposed: auto
  anchorage: auto
weatherProfile: west-norwegian
fish: [cod, mackerel]
goods: [building-materials, groceries, feed]
# The ferry lines across the fjords, and the coastal express: only the named ones, each once.
ferriesNamed: true
# Its buildings streamed in, as the Saronic: one file per chunk, fetched as the boat comes near.
streamBuildings: true
