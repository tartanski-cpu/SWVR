# Region request: Oban and its approaches (owner's choice, Oct 2026). Replaces the hand-built
# Sounds behind a debug toggle once it loads in the game (milestone 4). Full scale.
id: oban
name: Oban and Lorn
bbox: [-5.56, 56.375, -5.37, 56.475]   # lon/lat min, max: Kerrera to Connel, about 11.7 x 11.1 km
theme: north-hebridean
spine:
  harbour.sheltered: auto      # milestone 3 (Oban's piers or Dunstaffnage marina)
  pier.exposed: auto
  anchorage: auto
currentZones:                  # tidal races are not in open data: placed by hand (milestone 2)
  - name: Falls of Lora
    # The narrows under Connel Bridge, 600 m along the channel, 250 m across; floods east into Loch Etive.
    polygon: [[-5.3914, 56.4557], [-5.3816, 56.4557], [-5.3816, 56.4580], [-5.3914, 56.4580]]
    direction: 90
    peakKts: 6
    periodHours: 6
    whirls: 0                  # no whirlpools at the Falls (owner): the fast tide and standing waves only
weatherProfile: north-rough
fish: [mackerel, haddock, lobster]
goods: [feed, building-materials, whisky]
# What each harbour trades in the game (milestone 4), by harbour id (harbours.json). The
# game's cargo kinds (CONFIG.cargo.kinds): products ship out of here, needs are wanted here.
# repairs: the yard's prices as a factor on the game's standard rate. Unlisted harbours take
# part in every run.
economy:
  oban: { repairs: { hull: 1, engine: 1 }, products: [Whisky cask, Canned fish], needs: [Building materials, Groceries] }
  kerrera-marina: { needs: [Groceries, Gas bottle] }
  dunstaffnage-marina: { products: [Timber], needs: [Crate, Gas bottle] }
  kerrera-ferry-terminal: { needs: [Sack, Crate] }
  dunbeg-anchorage: { needs: [Feed sack] }
