# Hand edits for the Oban region (coast pipeline stage 7, src/harbours.ts). Applied after the
# harbours and buildings are generated from OpenStreetMap, so re-running the pipeline keeps
# them. Pieces are matched by their source (an OSM id such as way/150031043), a harbour by
# its id or name.
#
#   remove: [way/123, ...]                    drop pieces or harbours
#   change: [{match: ..., set: {field: value}}]  change any field (name, role, top, kind ...)
#   add: {blocks: [...], berths: [...], buildings: [...], slipways: [...]}  add pieces by hand

change:
  # The town harbour (the railway and north piers, the town quay and the pontoons) is named
  # after its marina pontoons in OpenStreetMap; call it what a skipper would.
  - match: North Pier Pontoons
    set: { name: Oban, id: oban }
