# Builds the game and publishes it to GitHub Pages, giving real HTTPS URLs the Quest
# browser can open directly:
#   https://tartanski-cpu.github.io/SWVR/        the game: the dev branch
#   https://tartanski-cpu.github.io/SWVR/next/   work in progress: the `next` branch
# A push to either branch rebuilds both, so each address always shows its branch's latest.
# A push to `next` comes in through next.yml (workflow_run), so that this always runs on
# the dev branch: GitHub lets only the dev branch deploy the site.
# The game must pass its tests to be published. If `next` fails its tests or build, the
# game is still published and /next/ says what happened.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/admiring-dirac-v9wwih]
  workflow_run:
    workflows: ['Next branch pushed']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the game (dev branch)
        uses: actions/checkout@v5
        with:
          ref: claude/admiring-dirac-v9wwih
          path: game
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json
      - name: Test and build the game
        working-directory: game
        run: npm ci && npm test && npm run build

      - name: Check out work in progress (next branch)
        id: next
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          ref: next
          path: next
      - name: Test and build work in progress
        id: nextbuild
        if: steps.next.outcome == 'success'
        continue-on-error: true
        working-directory: next
        env:
          VITE_CHANNEL: next
        run: npm ci && npm test && npm run build

      - name: Put the site together
        run: |
          mkdir site
          cp -r game/dist/. site/
          if [ "${{ steps.nextbuild.outcome }}" = "success" ]; then
            cp -r next/dist site/next
          else
            mkdir -p site/next
            echo '<!doctype html><meta charset="utf-8"><title>Workboat World: next</title><body style="font:18px system-ui;margin:2em;max-width:40em">The work-in-progress build (branch <b>next</b>) failed its tests or its build this time, so there is nothing new to try here. The game itself is at <a href="../">tartanski-cpu.github.io/SWVR</a>.</body>' > site/next/index.html
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
